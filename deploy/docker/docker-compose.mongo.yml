# Argus + MongoDB.
#   cp .env.example .env   # then set ARGUS_MASTER_KEY
#   docker compose -f deploy/docker/docker-compose.mongo.yml --env-file .env up -d --build
#
# Uses the bundled MongoDB container unless ARGUS_DB_URL is set in .env. To use your own server instead
# (e.g. Atlas, Cosmos DB, or one shared with another Argus instance), set ARGUS_DB_URL (and ARGUS_DB_NAME) and
# start only Argus:
#   docker compose -f deploy/docker/docker-compose.mongo.yml --env-file .env up -d --build --no-deps argus
name: argus-mongo

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      # Lets mongod 8 start on Linux 6.19+ kernels (SERVER-121912) by turning off TCMalloc per-CPU caches;
      # a small allocator-throughput cost. Remove once your mongo image recognises your kernel (docs/deployment/docker.md).
      GLIBC_TUNABLES: glibc.pthread.rseq=1
      MONGO_INITDB_ROOT_USERNAME: argus
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-argus-change-me}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  argus:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: argus:local
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '${ARGUS_HTTP_PORT:-8080}:8080'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      ARGUS_DB_TYPE: mongodb
      # ARGUS_DB_URL from .env wins; otherwise the bundled container. Use host.docker.internal for a database on this host.
      ARGUS_DB_URL: ${ARGUS_DB_URL:-mongodb://argus:${MONGO_PASSWORD:-argus-change-me}@mongo:27017/?authSource=admin}
      ARGUS_DB_NAME: ${ARGUS_DB_NAME:-argus}
      ARGUS_MASTER_KEY: ${ARGUS_MASTER_KEY:?Set ARGUS_MASTER_KEY in .env (openssl rand -base64 48)}
      ARGUS_ADMIN_PASSWORD: ${ARGUS_ADMIN_PASSWORD:-}
      ARGUS_PUBLIC_URL: ${ARGUS_PUBLIC_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ARGUS_AUTH_RATE_LIMIT: ${ARGUS_AUTH_RATE_LIMIT:-}
      ARGUS_WORKER_CONCURRENCY: ${ARGUS_WORKER_CONCURRENCY:-}
      ARGUS_SCAN_TIMEOUT_MINUTES: ${ARGUS_SCAN_TIMEOUT_MINUTES:-}
      ARGUS_SCHEDULER_INTERVAL_SECONDS: ${ARGUS_SCHEDULER_INTERVAL_SECONDS:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      NODE_USE_ENV_PROXY: ${NODE_USE_ENV_PROXY:-}
      ARGUS_OFFLINE: ${ARGUS_OFFLINE:-}
      SCAN: ${SCAN:-}
      ARGUS_OSV_URL: ${ARGUS_OSV_URL:-}
      ARGUS_KEV_URL: ${ARGUS_KEV_URL:-}
      ARGUS_EPSS_URL: ${ARGUS_EPSS_URL:-}
      ARGUS_EOL_URL: ${ARGUS_EOL_URL:-}
      ARGUS_GRAPH_URL: ${ARGUS_GRAPH_URL:-}
      ARGUS_ENTRA_LOGIN_URL: ${ARGUS_ENTRA_LOGIN_URL:-}
      ARGUS_NPM_REGISTRY_URL: ${ARGUS_NPM_REGISTRY_URL:-}
      ARGUS_NUGET_URL: ${ARGUS_NUGET_URL:-}
      ARGUS_DEPSDEV_URL: ${ARGUS_DEPSDEV_URL:-}
      # The image's bundled rules unless overridden (an empty value would turn code analysis off).
      ARGUS_OPENGREP_RULES: ${ARGUS_OPENGREP_RULES:-/opt/argus/rules/opengrep}
      # Trivy's own settings (registry credentials, database mirrors) can be added here, e.g. TRIVY_USERNAME, TRIVY_PASSWORD.
      ARGUS_NVD_URL: ${ARGUS_NVD_URL:-}
      ARGUS_NVD_API_KEY: ${ARGUS_NVD_API_KEY:-}
      ARGUS_METRICS_TOKEN: ${ARGUS_METRICS_TOKEN:-}

volumes:
  mongo-data:
